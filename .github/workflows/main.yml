
name: Build CUZZ CINEMATIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Build CUZZ CINEMATIC
        working-directory: source/CUZZ-CINEMATIC
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CUZZ-CINEMATIC-APK
          path: source/CUZZ-CINEMATIC/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
