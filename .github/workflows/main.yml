
name: Build CUZZ CINEMATIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Checking Android SDK..."
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/platform-tools"
          ls "$ANDROID_HOME/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CUZZ CINEMATIC
        working-directory: source/CUZZ-CINEMATIC
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        working-directory: source/CUZZ-CINEMATIC
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK file..."
          test -s "$APK"

          echo "Checking APK ZIP integrity..."
          unzip -t "$APK"

          echo "Checking APK signature..."
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"

          echo "APK verification successful!"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CUZZ-CINEMATIC-APK
          path: source/CUZZ-CINEMATIC/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
