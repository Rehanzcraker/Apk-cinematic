
name: CUZZ CINEMATIC APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Inspect Android Manifest
        run: |
          cd extracted/CUZZ-CINEMATIC
          echo "===== MANIFEST FILE ====="
          ls -l app/src/main/AndroidManifest.xml
          echo "===== MANIFEST CONTENT ====="
          cat -A app/src/main/AndroidManifest.xml
          echo "===== XML VALIDATION ====="
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML VALID')"

      - name: Build APK
        run: |
          cd extracted/CUZZ-CINEMATIC
          gradle assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CUZZ-CINEMATIC-APK
          path: extracted/CUZZ-CINEMATIC/app/build/outputs/apk/debug/*.apk
